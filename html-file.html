<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sovereign — Offline Document AI</title>
<style>
:root{--bg:#F5F3ED;--card:#FFFFFF;--line:#E2DDCF;--tx:#101A2E;--mu:#5E6A82;--ac:#8A6D0B;--btn:#101A2E;--btx:#F5F3ED;--ok:#0E8F5B;--bad:#C93C3C;--hi:#FBF3D0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#121B2E;--line:#22304A;--tx:#E8EDF5;--mu:#8A98B3;--ac:#D4AF37;--btn:#D4AF37;--btx:#0B1220;--ok:#3DDC97;--bad:#FF6B6B;--hi:#2A2410;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#121B2E;--line:#22304A;--tx:#E8EDF5;--mu:#8A98B3;--ac:#D4AF37;--btn:#D4AF37;--btx:#0B1220;--ok:#3DDC97;--bad:#FF6B6B;--hi:#2A2410;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font:700 20px Georgia,serif;letter-spacing:.5px;flex:1}.logo span{color:var(--ac)}
.badge{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ok);background:var(--card);white-space:nowrap}
.badge.on{color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button,select,input,textarea{font:inherit;color:var(--tx)}
.b{background:var(--btn);color:var(--btx);border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px}
.b.g{background:transparent;color:var(--tx);border:1px solid var(--line)}.b.d{background:var(--bad);color:#fff}
.b:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:42px}
textarea{min-height:120px;resize:vertical}
label{font-size:13px;color:var(--mu);display:block;margin:8px 0 4px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--hi);color:var(--ac);font-weight:600}
.mu{color:var(--mu);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font:700 20px Georgia,serif;color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--mu);font-size:11px;cursor:pointer}nav button i{display:block;font-style:normal;font-size:18px}
nav button.on{color:var(--ac);font-weight:700}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:92%;word-wrap:break-word}.msg.u{background:var(--btn);color:var(--btx);margin-left:auto}.msg.a{background:var(--card);border:1px solid var(--line)}
.cite{font-size:11px;background:var(--hi);color:var(--ac);padding:1px 7px;border-radius:6px;margin-left:4px;white-space:nowrap}
.chip{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px;cursor:pointer;color:var(--tx)}
pre{white-space:pre-wrap;word-wrap:break-word;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;max-height:300px;overflow:auto}
.fact{display:inline-block;background:var(--hi);border-radius:8px;padding:3px 9px;margin:3px 3px 0 0;font-size:13px}
.log{font:12px ui-monospace,Menlo,monospace;padding:6px 0;border-bottom:1px solid var(--line)}.log b{color:var(--ac)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock input{max-width:200px;text-align:center;font-size:24px;letter-spacing:8px;margin:14px 0 10px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--btn);color:var(--btx);padding:9px 16px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:.2s;pointer-events:none}#toast.s{opacity:1}
.hide{display:none!important}.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--tx);margin:0}.chk input{width:auto;min-height:0}
</style></head><body>
<div id="lock"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.6"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>
<h1 style="font-size:30px;margin-top:10px">Sovereign</h1><p class="mu" style="max-width:300px">Your documents never leave this device. Enter your PIN to unlock the vault.</p>
<input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"><button class="b" id="unl" data-a="unlock">Unlock</button><p id="perr" class="mu" style="min-height:20px"></p><p class="mu">Demo PIN: 1234</p></div>
<header><div class="logo">Sover<span>eign</span></div><span class="badge" id="net"></span><button class="b g" data-a="lockNow" style="min-height:34px;padding:4px 10px">Lock</button></header>
<main id="m"></main>
<nav><button data-t="vault"><i>▤</i>Vault</button><button data-t="ask"><i>✦</i>Ask</button><button data-t="ins"><i>◎</i>Insights</button><button data-t="red"><i>▬</i>Redact</button><button data-t="aud"><i>☰</i>Audit</button></nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={docs:[],log:[],tab:'vault',chat:[],busy:false,scope:'all',ins:'',red:{src:'',text:'',out:null,n:0},view:null,delc:null,fails:0,until:0,pin:'1234',paste:false,bytes:0};
let nid=1;
const SW=new Set('the a an and or of to in on for with is are was were be by at as it this that from what who when where which how does do did about any his her their its has have had not can will shall may must within before after'.split(' '));
const tok=t=>(t.toLowerCase().match(/[a-z0-9$@]+/g)||[]).filter(w=>!SW.has(w)).map(w=>w.length>4?w.replace(/(ing|es|s)$/,''):w);
const log=a=>S.log.unshift({t:new Date().toLocaleTimeString(),a});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),2000)}
function addDoc(title,tag,text){text=(text||'').trim();if(!text)return false;const d={id:nid++,title:(title||'Untitled').trim()||'Untitled',tag,text};S.docs.push(d);log('Added document “'+d.title+'”');return d}
addDoc('Settlement Memo – Hartwell v. Calder','Legal','Privileged and Confidential. Matter: Hartwell v. Calder Logistics, Case No. 24-CV-1182.\nMs. Priya Nair represents the plaintiff, Mr. Daniel Hartwell. The parties met on March 14, 2026 to discuss settlement.\nCalder Logistics offered $240,000 payable within 30 days. Mr. Hartwell’s counsel requested $310,000 plus legal fees.\nThe confidentiality clause bars both parties from disclosing terms. Breach carries a penalty of $50,000.\nNext step: respond to the offer by April 2, 2026. Contact priya.nair@lawfirm.example or 555-210-4477.');
addDoc('Patient Intake – J. Okafor','Healthcare','Patient: Mr. James Okafor, DOB 04/12/1981, MRN 00482913.\nHe reports chest tightness for two weeks, worse during exercise. Blood pressure was 152/94.\nCurrent medication: lisinopril 10 mg daily. Allergy: penicillin.\nDr. Alan Weiss ordered an ECG and a lipid panel, with follow-up on June 9, 2026.\nPatient phone: 555-338-9021. Insurance ID: HX-77120934.');
addDoc('Procurement Policy – Dept. of Transport','Government','Purchases above $25,000 require three written quotes and approval from the Procurement Director.\nEmergency purchases may skip quotes but must be reported within 5 business days.\nVendors must disclose conflicts of interest before bid opening on September 15, 2026.\nRecords are retained for 7 years and may not be stored on external cloud services.\nQuestions go to Ms. Elena Rossi at elena.rossi@transport.example.');
S.log=[];log('Vault initialised with 3 sample documents');
S.ins=S.docs[0].id;
const words=t=>(t.match(/\S+/g)||[]).length;
const opts=(sel,all)=>(all?`<option value="all"${sel==='all'?' selected':''}>All documents</option>`:'')+S.docs.map(d=>`<option value="${d.id}"${sel==d.id?' selected':''}>${esc(d.title)}</option>`).join('');
function netUpd(){const b=$('#net');const on=navigator.onLine;b.className='badge'+(on?' on':'');b.textContent=on?'● Network on · AI sends 0 bytes':'● Air-gapped · 0 bytes sent'}
addEventListener('online',netUpd);addEventListener('offline',netUpd);netUpd();
function draw(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));({vault:vaultV,ask:askV,ins:insV,red:redV,aud:audV})[S.tab]();}
function vaultV(){const w=S.docs.reduce((a,d)=>a+words(d.text),0);
$('#m').innerHTML=`<div class="stats"><div class="stat"><b>${S.docs.length}</b><span class="mu">Documents</span></div><div class="stat"><b>${w}</b><span class="mu">Words</span></div><div class="stat"><b>${S.bytes}</b><span class="mu">Bytes sent</span></div></div>
<div class="row" style="margin-bottom:12px"><button class="b" data-a="upl">Upload file</button><button class="b g" data-a="paste">${S.paste?'Close':'Paste text'}</button><input id="fi" type="file" accept=".txt,.md,.csv,.json,.log,text/*" class="hide"></div>
<div class="card ${S.paste?'':'hide'}"><label>Title</label><input id="pt" maxlength="80" placeholder="e.g. Board minutes"><label>Document text</label><textarea id="px" placeholder="Paste confidential text here. It stays in this browser tab."></textarea><div class="row" style="margin-top:10px"><button class="b" data-a="savep">Add to vault</button></div></div>
${S.docs.length?S.docs.map(d=>`<div class="card"><div class="row"><b class="sp">${esc(d.title)}</b><span class="tag">${esc(d.tag)}</span></div><div class="mu">${words(d.text)} words</div>${S.view===d.id?`<pre>${esc(d.text)}</pre>`:''}<div class="row" style="margin-top:8px"><button class="b g" data-a="view" data-i="${d.id}">${S.view===d.id?'Hide':'View'}</button><button class="b g" data-a="goask" data-i="${d.id}">Ask</button><button class="b g" data-a="goins" data-i="${d.id}">Insights</button><button class="b ${S.delc===d.id?'d':'g'}" data-a="del" data-i="${d.id}">${S.delc===d.id?'Confirm delete':'Delete'}</button></div></div>`).join(''):'<div class="card mu" style="text-align:center">Your vault is empty. Upload a text file or paste a document to begin.</div>'}`;
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>1.5e6)return toast('File too large (max 1.5 MB)');const r=new FileReader();r.onload=()=>{const t=String(r.result);if(/\u0000/.test(t.slice(0,2000)))return toast('Binary files are not supported');const d=addDoc(f.name.replace(/\.[^.]+$/,''),'Uploaded',t);d?(toast('Added to vault'),vaultV()):toast('File is empty')};r.onerror=()=>toast('Could not read file');r.readAsText(f)}}
function askV(){$('#m').innerHTML=`<div class="card"><label style="margin-top:0">Search in</label><select id="sc">${opts(S.scope,1)}</select></div><div id="msgs"></div><div class="row" style="margin:8px 0">${['What is the settlement offer?','Which medication is the patient taking?','When must vendors disclose conflicts?'].map(q=>`<button class="chip" data-a="chip">${q}</button>`).join('')}</div><div class="row"><input id="q" class="sp" maxlength="300" placeholder="Ask about your documents…" style="flex:1"><button class="b" id="snd" data-a="send">Ask</button></div>`;
$('#sc').onchange=e=>S.scope=e.target.value;$('#q').onkeydown=e=>{if(e.key==='Enter')send()};msgs()}
function msgs(){const m=$('#msgs');if(!m)return;m.innerHTML=(S.chat.length||S.busy?'':'<div class="card mu" style="text-align:center">Ask a question. Answers are built on-device from your documents and always cite their source.</div>')+S.chat.map(c=>`<div class="msg ${c.r}">${c.h}</div>`).join('')+(S.busy?'<div class="msg a mu">Analysing on-device…</div>':'');const b=$('#snd');if(b)b.disabled=S.busy;scrollTo(0,document.body.scrollHeight)}
function search(q,scope){const sents=[];S.docs.filter(d=>scope==='all'||d.id==scope).forEach(d=>d.text.split(/\n+/).forEach(p=>p.split(/(?<=[.!?])\s+/).forEach(s=>{if(s.trim().length>8)sents.push({d,s:s.trim(),t:new Set(tok(s))})})));
const qt=[...new Set(tok(q))];if(!qt.length||!sents.length)return[];const idf={};qt.forEach(t=>idf[t]=Math.log(1+sents.length/(1+sents.filter(x=>x.t.has(t)).length)));
return sents.map(x=>({...x,sc:qt.reduce((a,t)=>a+(x.t.has(t)?idf[t]:0),0)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3)}
function send(txt){if(S.busy)return;const i=$('#q');const q=(txt||(i?i.value:'')).trim();if(!q)return toast('Type a question first');
if(!S.docs.length)return toast('Add a document to the vault first');if(S.scope!=='all'&&!S.docs.some(d=>d.id==S.scope))S.scope='all';
S.chat.push({r:'u',h:esc(q)});if(i)i.value='';S.busy=true;log('Query: “'+q.slice(0,60)+'”');msgs();
setTimeout(()=>{const r=search(q,S.scope);S.chat.push({r:'a',h:r.length?`<b>Found in your documents</b>${r.map(x=>`<p style="margin:6px 0">${esc(x.s)}<span class="cite">${esc(x.d.title)}</span></p>`).join('')}<span class="mu">Answered on-device · 0 bytes sent</span>`:'I couldn’t find that in the selected documents. Try different keywords or widen the search. Nothing was looked up outside this device.'});S.busy=false;if(S.tab==='ask')msgs()},700)}
function facts(t){const g=(r)=>[...new Set(t.match(r)||[])];return{Dates:g(/\b(?:\d{1,2}\/\d{1,2}\/\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2}, \d{4})\b/g),Amounts:g(/\$\d[\d,]*(?:\.\d+)?/g),People:g(/\b(?:Dr|Mr|Ms|Mrs)\. [A-Z][a-z]+(?: [A-Z][a-z]+)?/g),Emails:g(/[\w.+-]+@[\w-]+\.[\w.]+/g),Phones:g(/\b\d{3}-\d{3}-\d{4}\b/g)}}
function summ(t){const ss=t.split(/\n+/).flatMap(p=>p.split(/(?<=[.!?])\s+/)).map(s=>s.trim()).filter(s=>s.length>15);const f={};tok(t).forEach(w=>f[w]=(f[w]||0)+1);const sc=ss.map((s,i)=>({s,i,v:tok(s).reduce((a,w)=>a+f[w],0)/Math.sqrt(tok(s).length||1)}));return sc.sort((a,b)=>b.v-a.v).slice(0,3).sort((a,b)=>a.i-b.i).map(x=>x.s)}
function insV(){if(!S.docs.length){$('#m').innerHTML='<div class="card mu" style="text-align:center">No documents to analyse. Add one in the Vault.</div>';return}
if(!S.docs.some(d=>d.id==S.ins))S.ins=S.docs[0].id;const d=S.docs.find(d=>d.id==S.ins),f=facts(d.text);
$('#m').innerHTML=`<div class="card"><label style="margin-top:0">Document</label><select id="is">${opts(S.ins)}</select></div><div class="card"><h3>Summary</h3>${summ(d.text).map(s=>`<p style="margin:8px 0">• ${esc(s)}</p>`).join('')||'<p class="mu">Not enough text to summarise.</p>'}</div><div class="card"><h3>Key facts</h3>${Object.entries(f).map(([k,v])=>v.length?`<div style="margin-top:8px"><span class="mu">${k}</span><br>${v.map(x=>`<span class="fact">${esc(x)}</span>`).join('')}</div>`:'').join('')||'<p class="mu">No dates, amounts, people or contacts detected.</p>'}</div><div class="row"><button class="b g" data-a="goask" data-i="${d.id}">Ask about this document</button><button class="b g" data-a="gored" data-i="${d.id}">Redact it</button></div>`;
$('#is').onchange=e=>{S.ins=e.target.value;log('Analysed “'+S.docs.find(x=>x.id==S.ins).title+'”');insV()};log('Analysed “'+d.title+'”')}
const RX=[['names',/\b(?:Dr|Mr|Ms|Mrs)\. [A-Z][a-z]+(?: [A-Z][a-z]+)?/g,'NAME'],['emails',/[\w.+-]+@[\w-]+\.[\w.]+/g,'EMAIL'],['ids',/\b[A-Z]{2}-\d{6,}\b|\b\d{3}-\d{2}-\d{4}\b|\b\d{8}\b/g,'ID'],['phones',/\b\d{3}-\d{3}-\d{4}\b/g,'PHONE'],['money',/\$\d[\d,]*(?:\.\d+)?/g,'AMOUNT'],['dates',/\b(?:\d{1,2}\/\d{1,2}\/\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2}, \d{4})\b/g,'DATE']];
function redV(){const r=S.red;$('#m').innerHTML=`<div class="card"><label style="margin-top:0">Source</label><select id="rs"><option value="">Paste my own text</option>${opts(r.src)}</select><label>Text to redact</label><textarea id="rt" placeholder="Paste or choose a document…">${esc(r.text)}</textarea><label>Hide these</label><div class="row">${RX.map(x=>`<label class="chk"><input type="checkbox" class="rc" value="${x[0]}" ${r.on&&!r.on.includes(x[0])?'':'checked'}>${x[0]}</label>`).join('')}</div><label>Extra words to hide (comma-separated)</label><input id="rx" maxlength="120" placeholder="e.g. Calder, Project Falcon" value="${esc(r.extra||'')}"><div class="row" style="margin-top:12px"><button class="b" data-a="redo">Redact</button><button class="b g" data-a="rclr">Clear</button></div></div>${r.out!==null?`<div class="card"><b>${r.n} item${r.n===1?'':'s'} redacted</b><pre>${esc(r.out)}</pre><div class="row"><button class="b g" data-a="rcopy">Copy</button><button class="b g" data-a="rsave">Save as new document</button></div></div>`:''}`;
$('#rs').onchange=e=>{r.src=e.target.value;const d=S.docs.find(x=>x.id==r.src);r.text=d?d.text:'';r.out=null;redV()};$('#rt').oninput=e=>r.text=e.target.value}
function doRed(){const r=S.red;r.text=$('#rt').value;r.extra=$('#rx').value;r.on=[...document.querySelectorAll('.rc:checked')].map(c=>c.value);if(!r.text.trim())return toast('Add some text first');if(!r.on.length&&!r.extra.trim())return toast('Choose what to hide');
let t=r.text,n=0;RX.filter(x=>r.on.includes(x[0])).forEach(x=>{t=t.replace(x[1],()=>{n++;return'['+x[2]+']'})});
r.extra.split(',').map(s=>s.trim()).filter(Boolean).forEach(w=>{t=t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),()=>{n++;return'[REDACTED]'})});
r.out=t;r.n=n;log('Redacted '+n+' items');redV()}
function audV(){$('#m').innerHTML=`<div class="card"><div class="row"><h3 class="sp">Audit log</h3><button class="b g" data-a="lcopy">Copy log</button></div><p class="mu">Every action is recorded here for compliance. Entries can’t be deleted.</p>${S.log.length?S.log.map(l=>`<div class="log"><b>${l.t}</b> · ${esc(l.a)}</div>`).join(''):'<p class="mu">No activity yet.</p>'}</div>`}
function copy(t,ok){try{navigator.clipboard.writeText(t).then(()=>toast(ok),()=>toast('Copy blocked. Select the text manually'))}catch(e){toast('Copy blocked. Select the text manually')}}
function lockNow(){S.chat=[];S.busy=false;S.red={src:'',text:'',out:null,n:0};log('Vault locked, session cleared');$('#lock').classList.remove('hide');$('#pin').value='';$('#perr').textContent=''}
function unlock(){const now=Date.now();if(now<S.until)return $('#perr').textContent='Too many attempts. Wait '+Math.ceil((S.until-now)/1000)+'s';
if($('#pin').value===S.pin){S.fails=0;log('Vault unlocked');$('#lock').classList.add('hide');$('#perr').textContent='';draw()}else{S.fails++;log('Failed unlock attempt '+S.fails);const l=$('#lock');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');$('#pin').value='';if(S.fails>=3){S.until=Date.now()+5000;S.fails=0;$('#perr').textContent='Too many attempts. Locked for 5s'}else $('#perr').textContent='Incorrect PIN'}}
$('#pin').onkeydown=e=>{if(e.key==='Enter')unlock()};
document.addEventListener('click',e=>{const n=e.target.closest('nav button');if(n){S.tab=n.dataset.t;S.delc=null;return draw()}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
if(a==='unlock')unlock();else if(a==='lockNow')lockNow();
else if(a==='upl')$('#fi').click();else if(a==='paste'){S.paste=!S.paste;vaultV()}
else if(a==='savep'){const x=$('#px').value;if(!x.trim())return toast('Paste some text first');addDoc($('#pt').value,'Pasted',x);S.paste=false;toast('Added to vault');vaultV()}
else if(a==='view'){S.view=S.view==i?null:+i;vaultV()}
else if(a==='del'){if(S.delc!=i){S.delc=+i;vaultV();setTimeout(()=>{if(S.delc==i){S.delc=null;if(S.tab==='vault')vaultV()}},3000)}else{const d=S.docs.find(x=>x.id==i);S.docs=S.docs.filter(x=>x.id!=i);S.delc=null;if(S.scope==i)S.scope='all';log('Deleted document “'+(d?d.title:'')+'”');toast('Document deleted');vaultV()}}
else if(a==='goask'){S.scope=i;S.tab='ask';draw()}else if(a==='goins'){S.ins=+i;S.tab='ins';draw()}
else if(a==='gored'){const d=S.docs.find(x=>x.id==i);S.red={src:+i,text:d.text,out:null,n:0};S.tab='red';draw()}
else if(a==='chip'){S.scope='all';const s=$('#sc');if(s)s.value='all';send(b.textContent)}
else if(a==='send')send();else if(a==='redo')doRed();else if(a==='rclr'){S.red={src:'',text:'',out:null,n:0};redV()}
else if(a==='rcopy')copy(S.red.out,'Copied');else if(a==='rsave'){addDoc('Redacted copy','Redacted',S.red.out);toast('Saved to vault')}
else if(a==='lcopy')copy(S.log.slice().reverse().map(l=>l.t+' '+l.a).join('\n'),'Log copied')});
draw();
</script></body></html>
